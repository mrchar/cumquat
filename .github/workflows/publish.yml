name: Publish

on:
  push:
    tags:
      - 'v*'

# Trusted Publishing：npm 通过 OIDC 免 token 验证发布身份
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/cumquat/package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION"
            exit 1
          fi

      - name: Build all packages
        run: pnpm -r build

      # pnpm pack 会把 workspace:* 依赖替换为真实版本号（npm 做不到）
      - name: Pack aggregate package
        run: pnpm --filter @mrchar/cumquat pack --pack-destination ./dist-pkg

      # npm >= 11.5.1 支持 Trusted Publishing（Node 24 内置 npm 11）
      - name: Setup Node 24 for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage package on npm (tokenless, deferred 2FA)
        run: npm stage publish ./dist-pkg/mrchar-cumquat-*.tgz --provenance --access public
